name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

# Minimal permissions — only what gh-deploy actually needs.
# contents:write lets mkdocs push the built site to the gh-pages branch.
# Everything else is explicitly denied by omission.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1 — pin to SHA to prevent supply-chain attacks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0   # full history needed for git-revision-date plugins

      - name: Set up Python
        # actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch self-hosted Mermaid JS
        run: |
          chmod +x ./fetch-mermaid.sh
          bash ./fetch-mermaid.sh

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
